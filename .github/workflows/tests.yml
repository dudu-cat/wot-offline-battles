name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run 0.8.2 and shared test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run 0.9.22 port test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m unittest discover -s ports/0.9.22/tests
          -p "test_*.py" -v
      - name: Check Python 2.6 client syntax
        run: |
          docker run --rm --entrypoint /bin/sh -v "$PWD:/work:ro" zinainfra/python26 -c '
            cp -R /work/scripts /tmp/scripts
            for source in $(find /tmp/scripts/client/gui/mods -name "*.py" -type f); do
              python2.6 -m py_compile "$source" || exit 1
            done
          '
      - name: Audit 0.9.22 battle source provenance
        run: python ports/0.9.22/tools/audit_battle_sources.py
      - name: Build Python 2.7 0.9.22 LAN client
        run: >-
          docker run --rm --platform linux/amd64 -v "$PWD:/work"
          -w /work/ports/0.9.22 python:2.7.18
          python build_wotmod.py
      - name: Validate 0.9.22 wotmod package
        run: >-
          python ports/0.9.22/tools/validate_wotmod.py
          ports/0.9.22/dist/org.peng.offline_lan_0922_0.3.51.wotmod
      - uses: actions/upload-artifact@v4
        with:
          name: wot-0.9.22-lan-client
          path: ports/0.9.22/dist/*
          if-no-files-found: error
