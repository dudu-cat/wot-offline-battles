name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Check Python 2.6 client syntax
        run: >-
          docker run --rm -v "$PWD:/work" -w /work zinainfra/python26
          -m compileall -q scripts/client/gui/mods
