name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Check Python 2.6 client syntax
        run: |
          docker run --rm --entrypoint /bin/sh -v "$PWD:/work:ro" zinainfra/python26 -c '
            cp -R /work/scripts /tmp/scripts
            for source in $(find /tmp/scripts/client/gui/mods -name "*.py" -type f); do
              python2.6 -m py_compile "$source" || exit 1
            done
          '
